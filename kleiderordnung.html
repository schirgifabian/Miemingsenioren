      '<div class="kit-row"><dt>Länge</dt><dd>' + LENGTH[ev.length] + (ev.length === "frei" ? " <small>freie Wahl</small>" : "") + "</dd></div>" +
      "</dl></div>" +
      (ev.note ? '<p class="note">' + esc(ev.note) + "</p>" : "") +
      shareButtons(ev, true) +
      "</section>";
  }

  function viewHTML() {
    var today = todayISO();
    var all = sortEvents(state.events || []);
    var upcoming = all.filter(function (e) { return !e.date || e.date >= today; });
    var past = all.filter(function (e) { return e.date && e.date < today; }).reverse();
    var h = "";
    if (state.example) {
      h += '<p class="notice">Das sind Beispieltermine. Über „Einteilung bearbeiten“ die echten Spieltage eintragen. Danach verschwindet dieser Hinweis.</p>';
    }
    if (upcoming.length) {
      h += boardHTML(upcoming[0]);
      if (upcoming.length > 1) {
        h += '<section class="list" aria-label="Weitere Spieltage"><h2 class="section-title">Weitere Spieltage</h2>' +
          upcoming.slice(1).map(function (e) { return rowHTML(e, true); }).join("") + "</section>";
      }
    } else {
      h += '<div class="empty"><h2 class="section-title">Noch kein Spieltag eingetragen</h2>' +
        "<p>Sobald die nächste Einteilung feststeht, steht hier, was wir anziehen.</p></div>";
    }
    if (past.length) {
      h += '<details class="past"><summary>Vergangene Spieltage (' + past.length + ")</summary>" +
        '<div class="list">' + past.map(function (e) { return rowHTML(e, false); }).join("") + "</div></details>";
    }
    return h;
  }

  function segHTML(ev, field, legend, options) {
    return '<fieldset class="seg"><legend>' + legend + "</legend>" +
      options.map(function (o) {
        var id = field + "-" + ev.id + "-" + o.value;
        return '<label for="' + id + '"><input type="radio" id="' + id + '" name="' + field + "-" + ev.id + '" value="' + o.value +
          '" data-ev="' + esc(ev.id) + '" data-f="' + field + '"' + (ev[field] === o.value ? " checked" : "") + "><span>" +
          (o.fill ? '<i class="sw" style="--sw:' + o.fill + '"></i>' : "") + o.label + "</span></label>";
      }).join("") + "</fieldset>";
  }

  function fieldHTML(ev, field, label, type, placeholder) {
    var id = field + "-" + ev.id;
    var input = type === "textarea"
      ? '<textarea id="' + id + '" data-ev="' + esc(ev.id) + '" data-f="' + field + '" placeholder="' + esc(placeholder) + '">' + esc(ev[field]) + "</textarea>"
      : '<input id="' + id + '" type="' + type + '" data-ev="' + esc(ev.id) + '" data-f="' + field + '" value="' + esc(ev[field]) + '" placeholder="' + esc(placeholder) + '">';
    return '<div class="field"><label for="' + id + '">' + label + "</label>" + input + "</div>";
  }

  function editorHTML() {
    var h = '<section class="editor" aria-label="Einteilung bearbeiten">' +
      '<h2 class="section-title">Einteilung bearbeiten</h2>' +
      "<p>Für jeden Spieltag Datum und Kleidung wählen. Mit „Speichern“ sieht die ganze Mannschaft die neue Einteilung unter demselben Link.</p>";
    draft.events.forEach(function (ev, i) {
      h += '<div class="ev-form">' +
        '<div class="ev-form-head"><h3>Spieltag ' + (i + 1) + "</h3>" +
        '<button type="button" class="btn btn-ghost btn-small danger" data-del="' + esc(ev.id) + '">Entfernen</button></div>' +
        '<div class="grid2">' +
        fieldHTML(ev, "date", "Datum", "date", "") +
        fieldHTML(ev, "time", "Treffpunkt (Uhrzeit)", "text", "z. B. 09:00") +
        fieldHTML(ev, "title", "Anlass", "text", "z. B. Heimspiel") +
        fieldHTML(ev, "place", "Ort", "text", "z. B. Golfclub Mieming") +
        "</div>" +
        segHTML(ev, "top", "Oberteil", [{ value: "blau", label: "Blau", fill: TOP.blau.fill }, { value: "weiss", label: "Weiß", fill: TOP.weiss.fill }]) +
        segHTML(ev, "pants", "Hose", [{ value: "schwarz", label: "Schwarz", fill: PANTS.schwarz.fill }, { value: "blau", label: "Blau", fill: PANTS.blau.fill }]) +
        segHTML(ev, "length", "Länge der Hose", [{ value: "frei", label: "Kurz oder lang" }, { value: "kurz", label: "Kurz" }, { value: "lang", label: "Lang" }]) +
        fieldHTML(ev, "note", "Hinweis (optional)", "textarea", "z. B. Regenjacke mitnehmen") +
        "</div>";
    });
    h += '<button type="button" class="btn btn-ghost" data-add>+ Spieltag hinzufügen</button>' +
      '<div class="editor-bar"><button type="button" class="btn btn-primary" data-save>Speichern</button>' +
      '<button type="button" class="btn btn-ghost" data-cancel>Abbrechen</button>' +
      '<p class="status" id="editor-status" aria-live="polite">' + esc(editorMsg) + "</p></div></section>";
    return h;
  }

  function render() {
    var h = '<div class="wrap"><header class="top"><div>' +
      '<span class="eyebrow">Golfclub Mieming · Tirol</span>' +
      "<h1>Seniorenmannschaft</h1>" +
      '<p class="lede">Was ziehen wir an? Hier steht für jeden Spieltag die Kleidung: Oberteil, Hose und ob kurz oder lang.</p></div>' +
      (canEdit && !editing ? '<button type="button" class="btn btn-ghost" data-edit>Einteilung bearbeiten</button>' : "") +
      "</header>" +
      (editing ? editorHTML() : viewHTML()) +
      "<footer><p>Zuletzt geändert: " + esc(new Date(state.updated).toLocaleDateString("de-AT", { day: "numeric", month: "long", year: "numeric" })) + "</p>" +
      "<p>Diesen Link in der Gruppe anpinnen. Er zeigt immer die aktuelle Einteilung.</p></footer></div>";
    app.innerHTML = h;
  }

  function newEvent() {
    return { id: "e" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), date: "", title: "", place: "", time: "", top: "blau", pants: "schwarz", length: "frei", note: "" };
  }
  function startEditing(fromDraft) {
    draft = fromDraft || { events: (state.example ? state.events : sortEvents(state.events || [])).map(function (e) { return Object.assign({}, e); }) };
    if (!draft.events.length) draft.events.push(newEvent());
    editing = true;
    render();
    window.scrollTo(0, 0);
  }

  function setStatus(id, text) { var el = document.getElementById(id); if (el) el.textContent = text; }

  function buildDoc(next) {
    var reset = "";
    var headStyle = document.head && document.head.querySelector("style");
    if (headStyle && /safe-area-inset/.test(headStyle.textContent)) reset = headStyle.textContent;
    else reset = ":root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}";
    var keep = Array.prototype.slice.call(document.querySelectorAll("[data-keep]"));
    var before = keep.filter(function (el) { return el.id !== "app-script"; }).map(function (el) { return el.outerHTML; }).join("\n");
    var json = JSON.stringify(next).replace(/</g, "\\u003c");
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + reset + "</style></head><body>" +
      before + '\n<script type="application/json" id="state">' + json + "</scr" + "ipt>\n" +
      '<div id="app"></div>\n' + document.getElementById("app-script").outerHTML + "</body></html>";
  }

  async function save() {
    var events = sortEvents(draft.events);
    if (events.some(function (e) { return !e.date; })) {
      editorMsg = "Bitte bei jedem Spieltag ein Datum eintragen.";
      setStatus("editor-status", editorMsg);
      return;
    }
    setStatus("editor-status", "Wird gespeichert …");
    var artifact = window.claude && window.claude.use ? await window.claude.use("artifact") : null;
    if (!artifact) { setStatus("editor-status", "Speichern ist in dieser Ansicht nicht möglich. Bitte die Seite in Claude öffnen."); return; }
    var next = { example: false, updated: new Date().toISOString(), events: events };
    try { sessionStorage.setItem(DRAFT_KEY, JSON.stringify({ events: events })); } catch (e) {}
    try {
      await artifact.publish(buildDoc(next));
      setStatus("editor-status", "Gespeichert. Die Seite lädt neu.");
    } catch (err) {
      var code = err && err.code;
      if (code === "conflict") setStatus("editor-status", "Inzwischen wurde eine andere Fassung gespeichert. Die Seite lädt neu, deine Eingaben bleiben erhalten.");
      else if (code === "not_writer" || code === "not_granted" || code === "consent_required" || code === "capability_disabled") {
        try { sessionStorage.removeItem(DRAFT_KEY); } catch (e) {}
        setStatus("editor-status", "Nur wer die Seite bearbeiten darf, kann die Einteilung speichern.");
      } else if (code === "rate_limited") setStatus("editor-status", "Gerade zu oft gespeichert. Bitte in einer Minute noch einmal.");
      else setStatus("editor-status", "Speichern hat nicht geklappt. Bitte gleich noch einmal versuchen.");
    }
  }

  // Share image: 1080 x 1350 (4:5), the team in the day's outfit
  var SKIN = "#E3B792", SHOE = "#F4F5F1", CAP = "#F4F5F1", INK = "#15231B";
  var C = { board: "#1C4733", ink: "#F3F7F1", muted: "#B5CBBD", tile: "#F6F8F4", panel: "#DCE5D8", flag: "#D2442A" };

  function drawPerson(ctx, ev, len, cx, y, s) {
    var t = TOP[ev.top] || TOP.blau, p = PANTS[ev.pants] || PANTS.schwarz;
    ctx.save();
    ctx.translate(cx - 100 * s, y);
    ctx.scale(s, s);
    ctx.lineJoin = "round"; ctx.lineCap = "round";
    function shape(d, fill) {
      var path = new Path2D(d);
      ctx.fillStyle = fill; ctx.fill(path);
      ctx.lineWidth = 2.5; ctx.strokeStyle = INK; ctx.stroke(path);
    }
    function limb(x1, y1, x2, y2, w) {
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
      ctx.lineWidth = w + 5; ctx.strokeStyle = INK; ctx.stroke();
      ctx.lineWidth = w; ctx.strokeStyle = SKIN; ctx.stroke();
    }
    function line(d, color) { ctx.lineWidth = 2; ctx.strokeStyle = color; ctx.stroke(new Path2D(d)); }
    function ellipse(x, yy, rx, ry, fill) {
      ctx.beginPath(); ctx.ellipse(x, yy, rx, ry, 0, 0, Math.PI * 2);
      ctx.fillStyle = fill; ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = INK; ctx.stroke();
    }
    var shoeY = len === "kurz" ? 288 : 297;
    if (len === "kurz") { limb(77, 205, 77, 284, 17); limb(123, 205, 123, 284, 17); }
    ellipse(72, shoeY, 18, 8, SHOE);
    ellipse(128, shoeY, 18, 8, SHOE);
    shape(len === "kurz" ? SHORT_D : LONG_D, p.fill);
    shape("M67 130 L133 130 L134 148 L66 148 Z", p.fill);
    line("M66 157 L134 157 M100 157 L100 180", p.detail);
    limb(41, 64, 36, 124, 13);
    limb(159, 64, 164, 124, 13);
    ellipse(36, 130, 8, 8, SKIN);
    ellipse(164, 130, 8, 8, SKIN);
    limb(100, 2, 100, 18, 15);
    ellipse(100, -16, 21, 23, SKIN);
    shape("M78 -22 Q79 -46 100 -46 Q121 -46 122 -22 Z", CAP);
    shape("M116 -24 L140 -20 Q142 -16 136 -16 L118 -18 Z", CAP);
    shape(SHIRT_D, t.fill);
    line("M40 39.5 L52 77.3 M160 39.5 L148 77.3 M100 30 L100 62", t.detail);
    ctx.fillStyle = t.detail;
    ctx.beginPath(); ctx.arc(100, 41, 2.4, 0, Math.PI * 2); ctx.arc(100, 52, 2.4, 0, Math.PI * 2); ctx.fill();
    shape(COLLAR_D, t.fill);
    ctx.restore();
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function fitFont(ctx, text, weight, family, size, minSize, maxW) {
    while (size > minSize) {
      ctx.font = weight + " " + size + "px " + family;
      if (ctx.measureText(text).width <= maxW) break;
      size -= 2;
    }
    ctx.font = weight + " " + size + "px " + family;
    return size;
  }
  function wrapLines(ctx, text, maxW, maxLines) {
    var words = text.split(/\s+/), lines = [], cur = "";
    words.forEach(function (w) {
      var test = cur ? cur + " " + w : w;
      if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = w; } else cur = test;
    });
    if (cur) lines.push(cur);
    if (lines.length > maxLines) { lines = lines.slice(0, maxLines); lines[maxLines - 1] += " …"; }
    return lines;
  }

  async function renderCard(ev) {
    var DISPLAY = '"Barlow Condensed", "Arial Narrow", sans-serif';
    var BODY = '"Atkinson Hyperlegible", "Segoe UI", sans-serif';
    try {
      await Promise.all([
        document.fonts.load('700 96px "Barlow Condensed"'),
        document.fonts.load('600 32px "Barlow Condensed"'),
        document.fonts.load('400 36px "Atkinson Hyperlegible"')
      ]);
    } catch (e) {}
    var W = 1080, H = 1350, M = 60;
    var cv = document.createElement("canvas");
    cv.width = W; cv.height = H;
    var ctx = cv.getContext("2d");
    var t = TOP[ev.top] || TOP.blau, p = PANTS[ev.pants] || PANTS.schwarz;

    ctx.fillStyle = C.board; ctx.fillRect(0, 0, W, H);
    ctx.textBaseline = "alphabetic";

    ctx.fillStyle = C.muted;
    ctx.font = "600 32px " + DISPLAY;
    if ("letterSpacing" in ctx) ctx.letterSpacing = "4px";
    ctx.fillText("SENIORENMANNSCHAFT · GOLFCLUB MIEMING", M, 100);
    if ("letterSpacing" in ctx) ctx.letterSpacing = "0px";

    ctx.fillStyle = C.ink;
    var dateText = fmtDate(ev.date).toUpperCase();
    fitFont(ctx, dateText, 700, DISPLAY, 100, 56, W - 2 * M);
    ctx.fillText(dateText, M, 200);

    var meta = metaLine(ev);
    if (meta) {
      ctx.fillStyle = C.muted;
      fitFont(ctx, meta, 400, BODY, 36, 26, W - 2 * M);
      ctx.fillText(meta, M, 256);
    }

    // The team
    ctx.fillStyle = C.panel;
    roundRect(ctx, M, 300, W - 2 * M, 600, 28); ctx.fill();
    var lens = ev.length === "frei" ? ["lang", "kurz", "lang"] : [ev.length, ev.length, ev.length];
    [240, 540, 840].forEach(function (cx, i) { drawPerson(ctx, ev, lens[i], cx, 411, 1.5); });

    // Tiles
    var tiles = [
      { label: "OBERTEIL", value: t.label.toUpperCase(), sw: t.fill },
      { label: "HOSE", value: p.label.toUpperCase(), sw: p.fill },
      { label: "LÄNGE", value: LENGTH[ev.length].toUpperCase() }
    ];
    var tw = (W - 2 * M - 2 * 30) / 3;
    tiles.forEach(function (tile, i) {
      var x = M + i * (tw + 30);
      ctx.fillStyle = C.muted;
      ctx.font = "600 30px " + DISPLAY;
      if ("letterSpacing" in ctx) ctx.letterSpacing = "4px";
      ctx.fillText(tile.label, x, 960);
      if ("letterSpacing" in ctx) ctx.letterSpacing = "0px";
      ctx.fillStyle = C.tile;
      roundRect(ctx, x, 980, tw, 120, 16); ctx.fill();
      var tx = x + 26;
      if (tile.sw) {
        ctx.beginPath(); ctx.arc(x + 50, 1040, 24, 0, Math.PI * 2);
        ctx.fillStyle = tile.sw; ctx.fill();
        ctx.lineWidth = 3; ctx.strokeStyle = "rgba(0,0,0,.3)"; ctx.stroke();
        tx = x + 92;
      }
      ctx.fillStyle = INK;
      fitFont(ctx, tile.value, 700, DISPLAY, 64, 34, x + tw - 20 - tx);
      ctx.fillText(tile.value, tx, 1062);
    });

    var y = 1180;
    if (ev.note) {
      ctx.fillStyle = C.ink;
      ctx.font = "400 38px " + BODY;
      wrapLines(ctx, ev.note, W - 2 * M, 2).forEach(function (l) { ctx.fillText(l, M, y); y += 50; });
    }

    // Footer flag
    ctx.strokeStyle = C.muted; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(M + 4, 1262); ctx.lineTo(M + 4, 1302); ctx.stroke();
    ctx.fillStyle = C.flag;
    ctx.beginPath(); ctx.moveTo(M + 6, 1263); ctx.lineTo(M + 32, 1272); ctx.lineTo(M + 6, 1281); ctx.closePath(); ctx.fill();
    ctx.fillStyle = C.muted;
    ctx.font = "400 28px " + BODY;
    ctx.fillText("Kleiderordnung der Seniorenmannschaft", M + 48, 1298);

    return new Promise(function (resolve, reject) {
      cv.toBlob(function (b) { b ? resolve(b) : reject(new Error("toBlob")); }, "image/png");
    });
  }

  function findEvent(id) { return (state.events || []).filter(function (e) { return e.id === id; })[0]; }

  async function makeImage(id) {
    var ev = findEvent(id);
    var box = document.getElementById("imgbox-" + id);
    if (!ev || !box) return;
    setStatus("status-" + id, "Bild wird erstellt …");
    try {
      var blob = await renderCard(ev);
      images[id] = blob;
      var canCopy = typeof ClipboardItem !== "undefined" && navigator.clipboard && navigator.clipboard.write;
      var light = !!box.closest(".board");
      box.innerHTML = '<img src="' + URL.createObjectURL(blob) + '" alt="' + esc("Bild für WhatsApp: " + fmtDate(ev.date) + ", Oberteil " + (TOP[ev.top] || TOP.blau).label + ", Hose " + (PANTS[ev.pants] || PANTS.schwarz).label + ", " + LENGTH[ev.length]) + '">' +
        '<div class="actions"><button type="button" class="btn ' + (light ? "btn-light" : "btn-primary") + '" data-save-img="' + esc(id) + '">Bild speichern</button>' +
        (canCopy ? '<button type="button" class="btn ' + (light ? "btn-outline-light" : "btn-ghost") + '" data-copy-img="' + esc(id) + '">Bild kopieren</button>' : "") + "</div>" +
        '<p class="hint">Bild speichern und in WhatsApp über die Büroklammer anhängen. Am Handy geht es auch so: Bild lange antippen und sichern.</p>';
      box.hidden = false;
      setStatus("status-" + id, "");
    } catch (e) {
      setStatus("status-" + id, "Das Bild konnte nicht erstellt werden.");
    }
  }

  async function saveImage(id) {
    var ev = findEvent(id), blob = images[id];
    if (!ev || !blob) return;
    var downloads = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
    if (!downloads) { setStatus("status-" + id, "Speichern geht hier nicht. Bitte das Bild lange antippen und sichern."); return; }
    try {
      await downloads.save({ filename: "Kleidung-" + (ev.date || "Spieltag") + ".png", data: blob });
      setStatus("status-" + id, "Bild gespeichert. Jetzt in der WhatsApp-Gruppe anhängen.");
    } catch (err) {
      var code = err && err.code;
      if (code === "declined") setStatus("status-" + id, "");
      else if (code === "rate_limited") setStatus("status-" + id, "Bitte kurz warten und noch einmal tippen.");
      else setStatus("status-" + id, "Speichern geht hier nicht. Bitte das Bild lange antippen und sichern.");
    }
  }

  async function copyImage(id) {
    var blob = images[id];
    if (!blob) return;
    try {
      await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
      setStatus("status-" + id, "Bild kopiert. Jetzt in WhatsApp einfügen.");
    } catch (e) {
      setStatus("status-" + id, "Kopieren geht hier nicht. Bitte „Bild speichern“ nehmen.");
    }
  }

  async function copyText(id) {
    var ev = (state.events || []).filter(function (e) { return e.id === id; })[0];
    if (!ev) return;
    var text = waText(ev);
    try {
      await navigator.clipboard.writeText(text);
      setStatus("status-" + id, "Kopiert. Jetzt in der WhatsApp-Gruppe einfügen.");
    } catch (e) {
      var ta = document.getElementById("fallback-" + id);
      if (ta) { ta.value = text; ta.hidden = false; ta.focus(); ta.select(); }
      setStatus("status-" + id, "Text markiert. Bitte mit „Kopieren“ übernehmen.");
    }
  }

  app.addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    if (b.hasAttribute("data-copy")) copyText(b.getAttribute("data-copy"));
    else if (b.hasAttribute("data-img")) makeImage(b.getAttribute("data-img"));
    else if (b.hasAttribute("data-save-img")) saveImage(b.getAttribute("data-save-img"));
    else if (b.hasAttribute("data-copy-img")) copyImage(b.getAttribute("data-copy-img"));
    else if (b.hasAttribute("data-edit")) { editorMsg = ""; startEditing(); }
    else if (b.hasAttribute("data-cancel")) { editing = false; draft = null; try { sessionStorage.removeItem(DRAFT_KEY); } catch (err) {} render(); }
    else if (b.hasAttribute("data-add")) { draft.events.push(newEvent()); render(); }
    else if (b.hasAttribute("data-del")) {
      var id = b.getAttribute("data-del");
      draft.events = draft.events.filter(function (ev) { return ev.id !== id; });
      render();
    }
    else if (b.hasAttribute("data-save")) save();
  });
  function onField(e) {
    var el = e.target;
    var f = el.getAttribute && el.getAttribute("data-f");
    if (!f || !draft) return;
    var ev = draft.events.filter(function (x) { return x.id === el.getAttribute("data-ev"); })[0];
    if (ev && (el.type !== "radio" || el.checked)) ev[f] = el.value;
  }
  app.addEventListener("input", onField);
  app.addEventListener("change", onField);

  // Restore an unsaved draft after a reload, unless it is exactly what is now published.
  var stash = null;
  try { stash = JSON.parse(sessionStorage.getItem(DRAFT_KEY) || "null"); } catch (e) {}
  if (stash && JSON.stringify(stash.events) === JSON.stringify(sortEvents(state.events || []))) {
    try { sessionStorage.removeItem(DRAFT_KEY); } catch (e) {}
    stash = null;
  }
  if (stash && canEdit) { editorMsg = "Deine letzten Eingaben sind wiederhergestellt. Bitte noch einmal speichern."; startEditing(stash); }
  else render();

  if (window.claude && window.claude.use) {
    window.claude.use("user").then(function (user) {
      return user ? user.canEdit() : false;
    }).then(function (ok) {
      if (ok && !canEdit) {
        canEdit = true;
        if (stash) { editorMsg = "Deine letzten Eingaben sind wiederhergestellt. Bitte noch einmal speichern."; startEditing(stash); }
        else if (!editing) render();
      }
    }).catch(function () {});
  }
})();
</script>
