<title>Kleiderordnung Seniorenmannschaft</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: one phone-width column; settings first, then the exact image and text that get sent, share buttons pinned to the bottom */
:root {
  --bg: #EDF1EB;
  --surface: #FFFFFF;
  --ink: #15231B;
  --muted: #55665B;
  --line: #CFD9CE;
  --board: #1C4733;
  --board-ink: #F3F7F1;
  --accent: #23724A;
  --accent-ink: #FFFFFF;
  --flag: #D2442A;
  --panel: #DCE5D8;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1611; --surface: #17221B; --ink: #E6EEE8; --muted: #9FB2A5; --line: #2B3B31;
    --board: #1E4A36; --board-ink: #F3F7F1; --accent: #5CBB85; --accent-ink: #0E1611; --flag: #F2694D; --panel: #233429;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1611; --surface: #17221B; --ink: #E6EEE8; --muted: #9FB2A5; --line: #2B3B31;
  --board: #1E4A36; --board-ink: #F3F7F1; --accent: #5CBB85; --accent-ink: #0E1611; --flag: #F2694D; --panel: #233429;
  color-scheme: dark;
}

body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 18px;
  line-height: 1.5;
}
.wrap {
  max-width: 40rem;
  margin: 0 auto;
  padding-block: 1.5rem 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid;
  gap: 1.5rem;
}
h1, h2 { text-wrap: balance; margin: 0; }
p { margin: 0; }
button, input, textarea { font: inherit; color: inherit; }

header { display: grid; gap: .25rem; }
.eyebrow {
  font-family: var(--font-display); font-weight: 600; font-size: .95rem;
  letter-spacing: .12em; text-transform: uppercase; color: var(--accent);
}
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(2.2rem, 9vw, 3.2rem); line-height: .95; }
.lede { color: var(--muted); }

.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 1rem;
  padding: 1.1rem; display: grid; gap: 1.1rem;
}
.section-title {
  font-family: var(--font-display); font-weight: 700; font-size: 1.45rem;
  text-transform: uppercase; letter-spacing: .04em;
}
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); gap: .9rem; }
.field { display: grid; gap: .3rem; min-width: 0; }
.field label, .seg legend { font-weight: 700; font-size: .95rem; }
.field input, .field textarea {
  border: 2px solid var(--line); border-radius: .5rem; background: var(--bg);
  padding: .55rem .7rem; min-height: 3rem; width: 100%; box-sizing: border-box;
}
.field textarea { min-height: 4rem; resize: vertical; }
.seg { border: 0; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: .5rem; min-width: 0; }
.seg legend { padding: 0; margin-bottom: .4rem; width: 100%; }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.seg span {
  display: inline-flex; align-items: center; gap: .55rem; min-height: 3.2rem; padding: .4rem 1.1rem;
  border: 2px solid var(--line); border-radius: .6rem; font-weight: 700; cursor: pointer; background: var(--surface);
  box-sizing: border-box;
}
.seg input:checked + span { border-color: var(--accent); background: var(--panel); box-shadow: inset 0 0 0 1px var(--accent); }
.sw {
  width: 1.4rem; height: 1.4rem; border-radius: 50%; flex: none;
  background: var(--sw); box-shadow: inset 0 0 0 2px rgba(0, 0, 0, .28);
}
.btn:focus-visible, .seg input:focus-visible + span, .field input:focus-visible, .field textarea:focus-visible {
  outline: 3px solid var(--flag); outline-offset: 2px;
}

.preview { display: grid; gap: .8rem; }
.preview img {
  width: 100%; max-width: 26rem; aspect-ratio: 4 / 5; border-radius: .8rem; display: block;
  background: var(--board); box-shadow: 0 2px 14px rgba(0, 0, 0, .2);
}
.msg {
  margin: 0; white-space: pre-wrap; font-family: var(--font-body); font-size: 1rem;
  background: var(--surface); border: 1px solid var(--line); border-radius: .8rem; padding: .9rem 1rem; max-width: 26rem;
  box-sizing: border-box;
}

.sharebar {
  position: sticky; bottom: 0; z-index: 5;
  background: var(--bg); border-top: 1px solid var(--line);
  margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding-block: .8rem calc(.8rem + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: .5rem;
}
.actions { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
  box-sizing: border-box; min-height: 3.2rem; padding: .6rem 1rem; border-radius: .6rem;
  border: 2px solid transparent; cursor: pointer; text-decoration: none; text-align: center;
  font-weight: 700; font-size: 1rem; line-height: 1.2;
}
.btn svg { width: 1.25em; height: 1.25em; flex: none; }
.btn-primary { background: var(--accent); color: var(--accent-ink); flex: 1 1 100%; font-size: 1.1rem; }
.btn-ghost { background: var(--surface); border-color: var(--line); color: var(--ink); flex: 1 1 0; }
.status { font-size: .95rem; color: var(--muted); min-height: 1.4em; }
.copy-fallback { width: 100%; min-height: 8rem; border-radius: .5rem; padding: .6rem; border: 2px solid var(--line); background: var(--surface); color: var(--ink); font-size: .95rem; box-sizing: border-box; }

@media (prefers-reduced-motion: no-preference) {
  .btn { transition: transform .12s ease; }
  .btn:active { transform: translateY(1px); }
}
</style>

<div class="wrap">
  <header>
    <span class="eyebrow">Golfclub Mieming · Tirol</span>
    <h1>Seniorenmannschaft</h1>
    <p class="lede">Kleidung für den Spieltag einstellen und mit Bild in die WhatsApp-Gruppe schicken.</p>
  </header>

  <form class="card" id="cfg" autocomplete="off">
    <h2 class="section-title">Spieltag</h2>
    <div class="grid2">
      <div class="field"><label for="f-date">Datum</label><input id="f-date" name="date" type="date"></div>
      <div class="field"><label for="f-time">Treffpunkt (Uhrzeit)</label><input id="f-time" name="time" type="time"></div>
      <div class="field"><label for="f-title">Anlass</label><input id="f-title" name="title" type="text" placeholder="z. B. Heimspiel"></div>
      <div class="field"><label for="f-place">Ort</label><input id="f-place" name="place" type="text" placeholder="z. B. Golfclub Mieming"></div>
    </div>
    <div class="field"><label for="f-note">Hinweis (optional)</label><textarea id="f-note" name="note" placeholder="z. B. Kanonenstart"></textarea></div>

    <h2 class="section-title">Kleidung</h2>
    <fieldset class="seg"><legend>Oberteil</legend>
      <label for="top-blau"><input type="radio" id="top-blau" name="top" value="blau"><span><i class="sw" style="--sw:#1F3366"></i>Dunkelblau</span></label>
      <label for="top-weiss"><input type="radio" id="top-weiss" name="top" value="weiss"><span><i class="sw" style="--sw:#FFFFFF"></i>Weiß</span></label>
    </fieldset>
    <fieldset class="seg"><legend>Hose</legend>
      <label for="pants-schwarz"><input type="radio" id="pants-schwarz" name="pants" value="schwarz"><span><i class="sw" style="--sw:#1B1D1F"></i>Schwarz</span></label>
      <label for="pants-blau"><input type="radio" id="pants-blau" name="pants" value="blau"><span><i class="sw" style="--sw:#1F3366"></i>Dunkelblau</span></label>
    </fieldset>
    <fieldset class="seg"><legend>Länge der Hose</legend>
      <label for="len-frei"><input type="radio" id="len-frei" name="length" value="frei"><span>Kurz oder lang</span></label>
      <label for="len-kurz"><input type="radio" id="len-kurz" name="length" value="kurz"><span>Kurz</span></label>
      <label for="len-lang"><input type="radio" id="len-lang" name="length" value="lang"><span>Lang</span></label>
    </fieldset>
  </form>

  <section class="preview" aria-labelledby="pv-title">
    <h2 class="section-title" id="pv-title">Das wird geschickt</h2>
    <img id="pv-img" alt="Vorschau des Bildes für WhatsApp">
    <pre class="msg" id="pv-text"></pre>
  </section>

  <div class="sharebar">
    <div class="actions">
      <button type="button" class="btn btn-primary" id="btn-share">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 3v12M7 8l5-5 5 5M5 13v7h14v-7"/></svg>
        <span id="btn-share-label">Bild und Text teilen</span>
      </button>
      <a class="btn btn-ghost" id="btn-wa" href="https://wa.me/" target="_blank" rel="noopener">Nur Text an WhatsApp</a>
      <button type="button" class="btn btn-ghost" id="btn-copy">Text kopieren</button>
    </div>
    <textarea class="copy-fallback" id="copy-fallback" readonly hidden aria-label="Text zum Kopieren"></textarea>
    <p class="status" id="status" aria-live="polite"></p>
  </div>
</div>

<script>
(function () {
  var TOP = {
    blau:  { label: "Dunkelblau", fill: "#1F3366", detail: "rgba(255,255,255,.4)" },
    weiss: { label: "Weiß", fill: "#FFFFFF", detail: "rgba(0,0,0,.28)" }
  };
  var PANTS = {
    schwarz: { label: "Schwarz", fill: "#1B1D1F", detail: "rgba(255,255,255,.3)" },
    blau:    { label: "Dunkelblau", fill: "#1F3366", detail: "rgba(255,255,255,.35)" }
  };
  var LENGTH = { kurz: "Kurz", lang: "Lang", frei: "Kurz oder lang" };
  var LONG_D = "M66 146 L134 146 L141 292 L107 292 L100 184 L93 292 L59 292 Z";
  var SHORT_D = "M66 146 L134 146 L143 218 L106 222 L100 188 L94 222 L57 218 Z";
  var SHIRT_D = "M72 24 L88 14 Q100 22 112 14 L128 24 L166 42 L154 80 L136 72 L137 134 Q100 140 63 134 L64 72 L46 80 L34 42 Z";
  var COLLAR_D = "M88 14 L100 30 L91 39 Z M112 14 L100 30 L109 39 Z";
  var STORE_KEY = "kleiderordnung-einstellung";
  var DEFAULTS = { date: "2026-10-18", time: "09:40", title: "Seniorenabschlussturnier", place: "Golfclub Mieming", note: "Kanonenstart", top: "blau", pants: "blau", length: "frei" };

  var form = document.getElementById("cfg");
  var img = document.getElementById("pv-img");
  var pvText = document.getElementById("pv-text");
  var statusEl = document.getElementById("status");
  var inArtifact = !!(window.claude && window.claude.use) && window.top !== window;
  var current = { blob: null, url: "", text: "", ev: null };
  var renderToken = 0;

  if (inArtifact) document.getElementById("btn-share-label").textContent = "Bild speichern oder teilen";

  function fmtDate(iso) {
    if (!iso) return "Datum offen";
    var d = new Date(iso + "T12:00:00");
    var opts = { weekday: "long", day: "numeric", month: "long" };
    if (d.getFullYear() !== new Date().getFullYear()) opts.year = "numeric";
    return d.toLocaleDateString("de-AT", opts);
  }
  function metaLine(ev) {
    var parts = [];
    if (ev.title) parts.push(ev.title);
    if (ev.place) parts.push(ev.place);
    if (ev.time) parts.push("Treffpunkt " + ev.time + " Uhr");
    return parts.join(" · ");
  }
  function lengthText(len) { return len === "frei" ? "kurz oder lang, freie Wahl" : (len === "kurz" ? "kurz" : "lang"); }
  function waText(ev) {
    var t = TOP[ev.top], p = PANTS[ev.pants];
    var lines = ["⛳ Seniorenmannschaft Mieming", fmtDate(ev.date) + (ev.title ? " – " + ev.title : "")];
    var where = [ev.place, ev.time ? "Treffpunkt " + ev.time + " Uhr" : ""].filter(Boolean).join(", ");
    if (where) lines.push(where);
    lines.push("", "Kleidung:", "👕 Oberteil: " + t.label.toUpperCase(), "👖 Hose: " + p.label.toUpperCase() + " – " + lengthText(ev.length));
    if (ev.note) lines.push("", ev.note);
    return lines.join("\n");
  }

  function readForm() {
    var fd = new FormData(form), ev = {};
    ["date", "time", "title", "place", "note", "top", "pants", "length"].forEach(function (k) { ev[k] = String(fd.get(k) || "").trim(); });
    if (!TOP[ev.top]) ev.top = "blau";
    if (!PANTS[ev.pants]) ev.pants = "schwarz";
    if (!LENGTH[ev.length]) ev.length = "frei";
    return ev;
  }
  function fillForm(ev) {
    ["date", "time", "title", "place", "note"].forEach(function (k) { form.elements[k].value = ev[k] || ""; });
    ["top", "pants", "length"].forEach(function (k) {
      var el = document.getElementById({ top: "top-", pants: "pants-", length: "len-" }[k] + ev[k]);
      if (el) el.checked = true;
    });
  }

  // Image: 1080 x 1350 (4:5), one player in the day's outfit
  var SKIN = "#E3B792", SHOE = "#F4F5F1", CAP = "#F4F5F1", INK = "#15231B";
  var C = { board: "#1C4733", ink: "#F3F7F1", muted: "#B5CBBD", tile: "#F6F8F4", panel: "#DCE5D8", flag: "#D2442A" };

  function drawPerson(ctx, ev, cx, y, s) {
    var t = TOP[ev.top], p = PANTS[ev.pants], len = ev.length;
    ctx.save();
    ctx.translate(cx - 100 * s, y);
    ctx.scale(s, s);
    ctx.lineJoin = "round"; ctx.lineCap = "round";
    function shape(d, fill) {
      var path = new Path2D(d);
      ctx.fillStyle = fill; ctx.fill(path);
      ctx.lineWidth = 2.5; ctx.strokeStyle = INK; ctx.stroke(path);
    }
    function limb(x1, y1, x2, y2, w) {
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
      ctx.lineWidth = w + 5; ctx.strokeStyle = INK; ctx.stroke();
      ctx.lineWidth = w; ctx.strokeStyle = SKIN; ctx.stroke();
    }
    function line(d, color) { ctx.lineWidth = 2; ctx.strokeStyle = color; ctx.stroke(new Path2D(d)); }
    function ellipse(x, yy, rx, ry, fill) {
      ctx.beginPath(); ctx.ellipse(x, yy, rx, ry, 0, 0, Math.PI * 2);
      ctx.fillStyle = fill; ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = INK; ctx.stroke();
    }
    if (len === "frei") {
      var ghost = new Path2D(LONG_D);
      ctx.globalAlpha = .3; ctx.fillStyle = p.fill; ctx.fill(ghost); ctx.globalAlpha = 1;
      ctx.setLineDash([6, 6]); ctx.lineWidth = 2.5; ctx.strokeStyle = INK; ctx.stroke(ghost); ctx.setLineDash([]);
      len = "kurz";
    }
    var shoeY = len === "kurz" ? 288 : 297;
    if (len === "kurz") { limb(77, 205, 77, 284, 17); limb(123, 205, 123, 284, 17); }
    ellipse(72, shoeY, 18, 8, SHOE);
    ellipse(128, shoeY, 18, 8, SHOE);
    shape(len === "kurz" ? SHORT_D : LONG_D, p.fill);
    shape("M67 130 L133 130 L134 148 L66 148 Z", p.fill);
    line("M66 157 L134 157 M100 157 L100 180", p.detail);
    limb(41, 64, 36, 124, 13);
    limb(159, 64, 164, 124, 13);
    ellipse(36, 130, 8, 8, SKIN);
    ellipse(164, 130, 8, 8, SKIN);
    limb(100, 2, 100, 18, 15);
    ellipse(100, -16, 21, 23, SKIN);
    shape("M78 -22 Q79 -46 100 -46 Q121 -46 122 -22 Z", CAP);
    shape("M116 -24 L140 -20 Q142 -16 136 -16 L118 -18 Z", CAP);
    shape(SHIRT_D, t.fill);
    line("M40 39.5 L52 77.3 M160 39.5 L148 77.3 M100 30 L100 62", t.detail);
    ctx.fillStyle = t.detail;
    ctx.beginPath(); ctx.arc(100, 41, 2.4, 0, Math.PI * 2); ctx.arc(100, 52, 2.4, 0, Math.PI * 2); ctx.fill();
    shape(COLLAR_D, t.fill);
    ctx.restore();
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function fitFont(ctx, text, weight, family, size, minSize, maxW) {
    while (size > minSize) {
      ctx.font = weight + " " + size + "px " + family;
      if (ctx.measureText(text).width <= maxW) break;
      size -= 2;
    }
    ctx.font = weight + " " + size + "px " + family;
  }
  function wrapLines(ctx, text, maxW, maxLines) {
    var words = text.split(/\s+/), lines = [], cur = "";
    words.forEach(function (w) {
      var test = cur ? cur + " " + w : w;
      if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = w; } else cur = test;
    });
    if (cur) lines.push(cur);
    if (lines.length > maxLines) { lines = lines.slice(0, maxLines); lines[maxLines - 1] += " …"; }
    return lines;
  }
  function spaced(ctx, on) { if ("letterSpacing" in ctx) ctx.letterSpacing = on ? "4px" : "0px"; }

  var fontsReady = null;
  function loadFonts() {
    if (!fontsReady) {
      fontsReady = Promise.all([
        document.fonts.load('700 96px "Barlow Condensed"'),
        document.fonts.load('600 32px "Barlow Condensed"'),
        document.fonts.load('400 36px "Atkinson Hyperlegible"')
      ]).catch(function () {});
    }
    return fontsReady;
  }

  async function renderCard(ev) {
    await loadFonts();
    var DISPLAY = '"Barlow Condensed", "Arial Narrow", sans-serif';
    var BODY = '"Atkinson Hyperlegible", "Segoe UI", sans-serif';
    var W = 1080, H = 1350, M = 60;
    var cv = document.createElement("canvas");
    cv.width = W; cv.height = H;
    var ctx = cv.getContext("2d");
    var t = TOP[ev.top], p = PANTS[ev.pants];

    ctx.fillStyle = C.board; ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = C.muted; ctx.font = "600 32px " + DISPLAY;
    spaced(ctx, true); ctx.fillText("SENIORENMANNSCHAFT · GOLFCLUB MIEMING", M, 100); spaced(ctx, false);

    ctx.fillStyle = C.ink;
    var dateText = fmtDate(ev.date).toUpperCase();
    fitFont(ctx, dateText, 700, DISPLAY, 100, 56, W - 2 * M);
    ctx.fillText(dateText, M, 200);

    var meta = metaLine(ev);
    if (meta) {
      ctx.fillStyle = C.muted;
      fitFont(ctx, meta, 400, BODY, 36, 24, W - 2 * M);
      ctx.fillText(meta, M, 256);
    }

    ctx.fillStyle = C.panel;
    roundRect(ctx, M, 300, W - 2 * M, 600, 28); ctx.fill();
    drawPerson(ctx, ev, W / 2, 398, 1.6);

    var tiles = [
      { label: "OBERTEIL", value: t.label.toUpperCase(), sw: t.fill },
      { label: "HOSE", value: p.label.toUpperCase(), sw: p.fill },
      { label: "LÄNGE", value: LENGTH[ev.length].toUpperCase() }
    ];
    var tw = (W - 2 * M - 2 * 30) / 3;
    tiles.forEach(function (tile, i) {
      var x = M + i * (tw + 30);
      ctx.fillStyle = C.muted; ctx.font = "600 30px " + DISPLAY;
      spaced(ctx, true); ctx.fillText(tile.label, x, 960); spaced(ctx, false);
      ctx.fillStyle = C.tile;
      roundRect(ctx, x, 980, tw, 120, 16); ctx.fill();
      var tx = x + 26;
      if (tile.sw) {
        ctx.beginPath(); ctx.arc(x + 50, 1040, 24, 0, Math.PI * 2);
        ctx.fillStyle = tile.sw; ctx.fill();
        ctx.lineWidth = 3; ctx.strokeStyle = "rgba(0,0,0,.3)"; ctx.stroke();
        tx = x + 92;
      }
      ctx.fillStyle = INK;
      fitFont(ctx, tile.value, 700, DISPLAY, 64, 34, x + tw - 20 - tx);
      ctx.fillText(tile.value, tx, 1062);
    });

    if (ev.note) {
      var y = 1180;
      ctx.fillStyle = C.ink; ctx.font = "400 38px " + BODY;
      wrapLines(ctx, ev.note, W - 2 * M, 2).forEach(function (l) { ctx.fillText(l, M, y); y += 50; });
    }

    ctx.strokeStyle = C.muted; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(M + 4, 1262); ctx.lineTo(M + 4, 1302); ctx.stroke();
    ctx.fillStyle = C.flag;
    ctx.beginPath(); ctx.moveTo(M + 6, 1263); ctx.lineTo(M + 32, 1272); ctx.lineTo(M + 6, 1281); ctx.closePath(); ctx.fill();
    ctx.fillStyle = C.muted; ctx.font = "400 28px " + BODY;
    ctx.fillText("Kleiderordnung der Seniorenmannschaft", M + 48, 1298);

    return new Promise(function (resolve, reject) {
      cv.toBlob(function (b) { b ? resolve(b) : reject(new Error("toBlob")); }, "image/png");
    });
  }

  function fileName(ev) { return "Kleidung-" + (ev.date || "Spieltag") + ".png"; }

  // Keep the image ready at all times, so sharing can start straight from the tap.
  async function update() {
    var ev = readForm();
    try { localStorage.setItem(STORE_KEY, JSON.stringify(ev)); } catch (e) {}
    var text = waText(ev);
    pvText.textContent = text;
    document.getElementById("btn-wa").href = "https://wa.me/?text=" + encodeURIComponent(text);
    current.text = text; current.ev = ev;
    var token = ++renderToken;
    try {
      var blob = await renderCard(ev);
      if (token !== renderToken) return;
      if (current.url) URL.revokeObjectURL(current.url);
      current.blob = blob;
      current.url = URL.createObjectURL(blob);
      img.src = current.url;
      img.alt = "Bild für WhatsApp: " + fmtDate(ev.date) + ", Oberteil " + TOP[ev.top].label + ", Hose " + PANTS[ev.pants].label + ", " + LENGTH[ev.length];
    } catch (e) {
      statusEl.textContent = "Das Bild konnte nicht erstellt werden.";
    }
  }
  var timer = null;
  function scheduleUpdate() { clearTimeout(timer); timer = setTimeout(update, 150); }
  form.addEventListener("input", scheduleUpdate);
  form.addEventListener("change", scheduleUpdate);
  form.addEventListener("submit", function (e) { e.preventDefault(); });

  async function shareAll() {
    if (!current.blob) { statusEl.textContent = "Das Bild wird noch erstellt. Bitte gleich noch einmal tippen."; return; }
    var ev = current.ev, text = current.text;
    var file = null;
    try { file = new File([current.blob], fileName(ev), { type: "image/png" }); } catch (e) {}
    if (!inArtifact && file && navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], text: text });
        statusEl.textContent = "Geteilt.";
        return;
      } catch (e) {
        if (e && e.name === "AbortError") { statusEl.textContent = ""; return; }
      }
    }
    var downloads = inArtifact ? await window.claude.use("downloads") : null;
    if (downloads) {
      try {
        await downloads.save({ filename: fileName(ev), data: current.blob });
        statusEl.textContent = "Bild ist bereit. In WhatsApp anhängen, den Text mit „Nur Text an WhatsApp“ dazuschicken.";
      } catch (err) {
        var code = err && err.code;
        if (code === "declined") statusEl.textContent = "";
        else if (code === "rate_limited") statusEl.textContent = "Bitte kurz warten und noch einmal tippen.";
        else statusEl.textContent = "Speichern geht hier nicht. Bitte das Bild oben lange antippen und sichern.";
      }
      return;
    }
    if (inArtifact) { statusEl.textContent = "Speichern geht hier nicht. Bitte das Bild oben lange antippen und sichern."; return; }
    // Browser without file sharing: hand over the image as a normal download.
    var a = document.createElement("a");
    a.href = current.url; a.download = fileName(ev);
    document.body.appendChild(a); a.click(); a.remove();
    statusEl.textContent = "Bild gespeichert. In WhatsApp anhängen, den Text mit „Nur Text an WhatsApp“ dazuschicken.";
  }

  async function copyText() {
    try {
      await navigator.clipboard.writeText(current.text);
      statusEl.textContent = "Text kopiert. Jetzt in WhatsApp einfügen.";
    } catch (e) {
      var ta = document.getElementById("copy-fallback");
      ta.value = current.text; ta.hidden = false; ta.focus(); ta.select();
      statusEl.textContent = "Text markiert. Bitte mit „Kopieren“ übernehmen.";
    }
  }

  document.getElementById("btn-share").addEventListener("click", shareAll);
  document.getElementById("btn-copy").addEventListener("click", copyText);

  var saved = null;
  try { saved = JSON.parse(localStorage.getItem(STORE_KEY) || "null"); } catch (e) {}
  fillForm(Object.assign({}, DEFAULTS, saved || {}));
  update();
})();
</script>
