  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];

  }
  function pad(n) { return (n < 10 ? "0" : "") + n; }

  }

    if (!iso) return "Datum offen";
    var d = toDate(iso);
    var opts = { weekday: "long", day: "numeric", month: "long" };
    if (d.getFullYear() !== new Date().getFullYear()) opts.year = "numeric";
    return d.toLocaleDateString("de-AT", opts);
  }
  function relDays(iso) {
    var diff = Math.round((toDate(iso) - toDate(todayISO())) / 86400000);
    if (diff === 0) return "heute";
    if (diff === 1) return "morgen";
    if (diff > 1 && diff < 14) return "in " + diff + " Tagen";
    return "";

  function sortEvents(list) {
    return list.slice().sort(function (a, b) { return (a.date || "9999").localeCompare(b.date || "9999"); });

    var parts = [];

      '<path d="M72 24 L88 14 Q100 22 112 14 L128 24 L166 42 L154 80 L136 72 L137 134 Q100 140 63 134 L64 72 L46 80 L34 42 Z" fill="' + t.fill + '" class="g-line"/>' +

  function waText(ev) {
    var t = TOP[ev.top] || TOP.blau, p = PANTS[ev.pants] || PANTS.schwarz;

  var ICON_WA = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.8-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.2 2.2 2.2 0 0 0 .1-1.3c0-.1-.2-.2-.4-.3Z"/></svg>';

        "<p>Sobald die nächste Einteilung feststeht, steht hier, was wir anziehen.</p></div>";
    }
    if (past.length) {
      h += '<details class="past"><summary>Vergangene Spieltage (' + past.length + ")</summary>" +
        '<div class="list">' + past.map(function (e) { return rowHTML(e, false); }).join("") + "</div></details>";
    }
    return h;
  }

  function segHTML(ev, field, legend, options) {
    return '<fieldset class="seg"><legend>' + legend + "</legend>" +
      options.map(function (o) {
        var id = field + "-" + ev.id + "-" + o.value;
        return '<label for="' + id + '"><input type="radio" id="' + id + '" name="' + field + "-" + ev.id + '" value="' + o.value +
          '" data-ev="' + esc(ev.id) + '" data-f="' + field + '"' + (ev[field] === o.value ? " checked" : "") + "><span>" +
          (o.fill ? '<i class="sw" style="--sw:' + o.fill + '"></i>' : "") + o.label + "</span></label>";
      }).join("") + "</fieldset>";
  }

  function fieldHTML(ev, field, label, type, placeholder) {
    var id = field + "-" + ev.id;
    var input = type === "textarea"
      ? '<textarea id="' + id + '" data-ev="' + esc(ev.id) + '" data-f="' + field + '" placeholder="' + esc(placeholder) + '">' + esc(ev[field]) + "</textarea>"
      : '<input id="' + id + '" type="' + type + '" data-ev="' + esc(ev.id) + '" data-f="' + field + '" value="' + esc(ev[field]) + '" placeholder="' + esc(placeholder) + '">';
    return '<div class="field"><label for="' + id + '">' + label + "</label>" + input + "</div>";
  }

  function editorHTML() {
    var h = '<section class="editor" aria-label="Einteilung bearbeiten">' +
      '<h2 class="section-title">Einteilung bearbeiten</h2>' +
      "<p>Für jeden Spieltag Datum und Kleidung wählen. Mit „Speichern“ sieht die ganze Mannschaft die neue Einteilung unter demselben Link.</p>";
    draft.events.forEach(function (ev, i) {
      h += '<div class="ev-form">' +
        '<div class="ev-form-head"><h3>Spieltag ' + (i + 1) + "</h3>" +
        '<button type="button" class="btn btn-ghost btn-small danger" data-del="' + esc(ev.id) + '">Entfernen</button></div>' +
        '<div class="grid2">' +
        fieldHTML(ev, "date", "Datum", "date", "") +
        fieldHTML(ev, "time", "Treffpunkt (Uhrzeit)", "text", "z. B. 09:00") +
        fieldHTML(ev, "title", "Anlass", "text", "z. B. Heimspiel") +
        fieldHTML(ev, "place", "Ort", "text", "z. B. Golfclub Mieming") +
        "</div>" +
        segHTML(ev, "top", "Oberteil", [{ value: "blau", label: "Blau", fill: TOP.blau.fill }, { value: "weiss", label: "Weiß", fill: TOP.weiss.fill }]) +
        segHTML(ev, "pants", "Hose", [{ value: "schwarz", label: "Schwarz", fill: PANTS.schwarz.fill }, { value: "blau", label: "Blau", fill: PANTS.blau.fill }]) +
        segHTML(ev, "length", "Länge der Hose", [{ value: "frei", label: "Kurz oder lang" }, { value: "kurz", label: "Kurz" }, { value: "lang", label: "Lang" }]) +
        fieldHTML(ev, "note", "Hinweis (optional)", "textarea", "z. B. Regenjacke mitnehmen") +
        "</div>";
    });
    h += '<button type="button" class="btn btn-ghost" data-add>+ Spieltag hinzufügen</button>' +
      '<div class="editor-bar"><button type="button" class="btn btn-primary" data-save>Speichern</button>' +
      '<button type="button" class="btn btn-ghost" data-cancel>Abbrechen</button>' +
      '<p class="status" id="editor-status" aria-live="polite">' + esc(editorMsg) + "</p></div></section>";
    return h;
  }

  function render() {
    var h = '<div class="wrap"><header class="top"><div>' +
      '<span class="eyebrow">Golfclub Mieming · Tirol</span>' +
      "<h1>Seniorenmannschaft</h1>" +
      '<p class="lede">Was ziehen wir an? Hier steht für jeden Spieltag die Kleidung: Oberteil, Hose und ob kurz oder lang.</p></div>' +
      (canEdit && !editing ? '<button type="button" class="btn btn-ghost" data-edit>Einteilung bearbeiten</button>' : "") +
      "</header>" +
      (editing ? editorHTML() : viewHTML()) +
      "<footer><p>Zuletzt geändert: " + esc(new Date(state.updated).toLocaleDateString("de-AT", { day: "numeric", month: "long", year: "numeric" })) + "</p>" +
      "<p>Diesen Link in der Gruppe anpinnen. Er zeigt immer die aktuelle Einteilung.</p></footer></div>";
    app.innerHTML = h;
  }

  function newEvent() {
    return { id: "e" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), date: "", title: "", place: "", time: "", top: "blau", pants: "schwarz", length: "frei", note: "" };
  }
  function startEditing(fromDraft) {
    draft = fromDraft || { events: (state.example ? state.events : sortEvents(state.events || [])).map(function (e) { return Object.assign({}, e); }) };
    if (!draft.events.length) draft.events.push(newEvent());
    editing = true;
    render();
    window.scrollTo(0, 0);
  }

  function setStatus(id, text) { var el = document.getElementById(id); if (el) el.textContent = text; }

  function buildDoc(next) {
    var reset = "";
    var headStyle = document.head && document.head.querySelector("style");
    if (headStyle && /safe-area-inset/.test(headStyle.textContent)) reset = headStyle.textContent;
    else reset = ":root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}";
    var keep = Array.prototype.slice.call(document.querySelectorAll("[data-keep]"));
    var before = keep.filter(function (el) { return el.id !== "app-script"; }).map(function (el) { return el.outerHTML; }).join("\n");
    var json = JSON.stringify(next).replace(/</g, "\\u003c");
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + reset + "</style></head><body>" +
      before + '\n<script type="application/json" id="state">' + json + "</scr" + "ipt>\n" +
      '<div id="app"></div>\n' + document.getElementById("app-script").outerHTML + "</body></html>";
  }

  async function save() {
    var events = sortEvents(draft.events);
    if (events.some(function (e) { return !e.date; })) {
      editorMsg = "Bitte bei jedem Spieltag ein Datum eintragen.";
      setStatus("editor-status", editorMsg);
      return;
    }
    setStatus("editor-status", "Wird gespeichert …");
    var artifact = window.claude && window.claude.use ? await window.claude.use("artifact") : null;
    if (!artifact) { setStatus("editor-status", "Speichern ist in dieser Ansicht nicht möglich. Bitte die Seite in Claude öffnen."); return; }
    var next = { example: false, updated: new Date().toISOString(), events: events };
    try { sessionStorage.setItem(DRAFT_KEY, JSON.stringify({ events: events })); } catch (e) {}
    try {
      await artifact.publish(buildDoc(next));
      setStatus("editor-status", "Gespeichert. Die Seite lädt neu.");
    } catch (err) {
      var code = err && err.code;
      if (code === "conflict") setStatus("editor-status", "Inzwischen wurde eine andere Fassung gespeichert. Die Seite lädt neu, deine Eingaben bleiben erhalten.");
      else if (code === "not_writer" || code === "not_granted" || code === "consent_required" || code === "capability_disabled") {
        try { sessionStorage.removeItem(DRAFT_KEY); } catch (e) {}
        setStatus("editor-status", "Nur wer die Seite bearbeiten darf, kann die Einteilung speichern.");
      } else if (code === "rate_limited") setStatus("editor-status", "Gerade zu oft gespeichert. Bitte in einer Minute noch einmal.");
      else setStatus("editor-status", "Speichern hat nicht geklappt. Bitte gleich noch einmal versuchen.");
    }
  }

  async function copyText(id) {
    var ev = (state.events || []).filter(function (e) { return e.id === id; })[0];
    if (!ev) return;
    var text = waText(ev);
    try {
      await navigator.clipboard.writeText(text);
      setStatus("status-" + id, "Kopiert. Jetzt in der WhatsApp-Gruppe einfügen.");
    } catch (e) {
      var ta = document.getElementById("fallback-" + id);
      if (ta) { ta.value = text; ta.hidden = false; ta.focus(); ta.select(); }
      setStatus("status-" + id, "Text markiert. Bitte mit „Kopieren“ übernehmen.");
    }
  }

  app.addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    if (b.hasAttribute("data-copy")) copyText(b.getAttribute("data-copy"));
    else if (b.hasAttribute("data-edit")) { editorMsg = ""; startEditing(); }
    else if (b.hasAttribute("data-cancel")) { editing = false; draft = null; try { sessionStorage.removeItem(DRAFT_KEY); } catch (err) {} render(); }
    else if (b.hasAttribute("data-add")) { draft.events.push(newEvent()); render(); }
    else if (b.hasAttribute("data-del")) {
      var id = b.getAttribute("data-del");
      draft.events = draft.events.filter(function (ev) { return ev.id !== id; });
      render();
    }
    else if (b.hasAttribute("data-save")) save();
  });
  function onField(e) {
    var el = e.target;
    var f = el.getAttribute && el.getAttribute("data-f");
    if (!f || !draft) return;
    var ev = draft.events.filter(function (x) { return x.id === el.getAttribute("data-ev"); })[0];
    if (ev && (el.type !== "radio" || el.checked)) ev[f] = el.value;
  }
  app.addEventListener("input", onField);
  app.addEventListener("change", onField);

  // Restore an unsaved draft after a reload, unless it is exactly what is now published.
  var stash = null;
  try { stash = JSON.parse(sessionStorage.getItem(DRAFT_KEY) || "null"); } catch (e) {}
  if (stash && JSON.stringify(stash.events) === JSON.stringify(sortEvents(state.events || []))) {
    try { sessionStorage.removeItem(DRAFT_KEY); } catch (e) {}
    stash = null;
  }
  if (stash && canEdit) { editorMsg = "Deine letzten Eingaben sind wiederhergestellt. Bitte noch einmal speichern."; startEditing(stash); }
  else render();

  if (window.claude && window.claude.use) {
    window.claude.use("user").then(function (user) {
      return user ? user.canEdit() : false;
    }).then(function (ok) {
      if (ok && !canEdit) {
        canEdit = true;
        if (stash) { editorMsg = "Deine letzten Eingaben sind wiederhergestellt. Bitte noch einmal speichern."; startEditing(stash); }
        else if (!editing) render();
      }
    }).catch(function () {});
  }
})();
</script>
